service:
  name: opc-ua-client-service
  environment: local
  mode: edge
api:
  host: 0.0.0.0
  port: 8080
  management_token: example-management-token
logging:
  level: INFO
  json_logs: true
buffer:
  redis_url: redis://redis:6379/0
  key_prefix: opcua-client
  max_attempts: 10
  flush_batch_size: 100
  flush_interval_seconds: 5
  retry_base_delay_seconds: 5
  retry_max_delay_seconds: 300
  retention_hours: 72
publisher:
  mode: rabbitmq
  url: amqp://guest:guest@rabbitmq:5672/
  exchange: opcua.events
  exchange_type: direct
  routing_key: opcua.parameter.events
  queue_name: opcua.parameter.events
  declare_exchange: true
  declare_queue: true
  durable: true
  timeout_seconds: 5
endpoints:
- id: rig-opc-primary
  enabled: true
  url: opc.tcp://mock-opcua-server:4840/freeopcua/server/
  security_policy: None
  security_mode: None
  auth:
    mode: anonymous
  session_timeout_ms: 60000
  request_timeout_seconds: 5.0
  reconnect_policy:
    initial_delay_seconds: 2.0
    max_delay_seconds: 30.0
    backoff_multiplier: 2.0
    failure_threshold: 5
  subscription_defaults:
    publish_interval_ms: 1000
    keepalive_count: 10
    lifetime_count: 30
    queue_size: 100
  metadata:
    source_id: rig-site-01
    source_system_id: scada-main
    owner_type: rig
    owner_id: rig-01
    site_id: pad-a
    asset_id: pump-01
    tags:
    - edge
    - opcua
    - docker
- id: rig-opc-server
  enabled: false
  url: opc.tcp://192.168.1.100:4840
  security_policy: None
  security_mode: None
  auth:
    mode: anonymous
  session_timeout_ms: 60000
  request_timeout_seconds: 10.0
  reconnect_policy:
    initial_delay_seconds: 2.0
    max_delay_seconds: 30.0
    backoff_multiplier: 2.0
    failure_threshold: 5
  subscription_defaults:
    publish_interval_ms: 1000
    keepalive_count: 10
    lifetime_count: 30
    queue_size: 100
  metadata:
    source_id: rig-site-01
    source_system_id: scada-main
    owner_type: rig
    owner_id: rig-01
    site_id: pad-a
    asset_id: pump-01
    tags: []
nodes:
- id: rig-opc-primary-0-auditing
  endpoint_id: rig-opc-primary
  node_id: i=2994
  browse_name: 0:Auditing
  display_name: Auditing
  acquisition_mode: subscription
  read_enabled: true
  write_enabled: false
  sampling_interval_ms: 1000
  polling_interval_seconds: 5.0
  parameter_code: 0:Auditing
  parameter_name: Auditing
  expected_type: float
  value_shape: scalar
  group_id: rig-opc-primary-0-server
  group_path:
  - 0:Server
  group_display_name: Server
  input_control:
    stale_after_seconds: 30
    suppress_duplicates: false
  value_transform:
    scale_factor: 1.0
    offset: 0.0
  metadata:
    opcua_browse_name: 0:Auditing
    opcua_display_name: Auditing
    opcua_data_type: Boolean
  tags: []
